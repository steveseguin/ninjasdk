[package]
name = "vdoninja-core"
description = "Engine-agnostic VDO.Ninja protocol core: hashing, AES-CBC signaling encryption, sanitization, TURN selection and wire message types."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["webrtc", "vdo-ninja", "p2p", "signaling"]
categories = ["network-programming", "multimedia"]

[dependencies]
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
