[package]
name = "vdoninja"
description = "VDO.Ninja SDK for Rust: WebRTC audio, video and data with VDO.Ninja-compatible signaling, built on webrtc-rs (Linux first)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../README.md"
keywords = ["webrtc", "vdo-ninja", "p2p", "streaming", "whip"]
categories = ["network-programming", "multimedia"]

[dependencies]
vdoninja-core = { version = "0.1.0", path = "../vdoninja-core" }
webrtc = "0.21"
rtc = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "vdoninja-signal"
path = "src/bin/vdoninja-signal.rs"
