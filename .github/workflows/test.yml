name: SDK Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
        webrtc-lib: ['@roamhq/wrtc', 'node-datachannel']

    name: Node ${{ matrix.node-version }} - ${{ matrix.webrtc-lib }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: |
        npm install
        npm install ${{ matrix.webrtc-lib }}

    - name: Run deterministic reliability tests
      run: npm run test:reliability

    - name: Test tally snapshots and OSC output
      run: node --test tests/tally-osc.test.cjs

    - name: Verify TypeScript entry points
      run: npm run test:types

    - name: Check generated guides and local links
      run: npm run test:docs

    - name: Run alias compatibility test
      run: |
        cat > test-aliases.js << 'EOF'
        const VDONinjaSDK = require('./vdoninja-sdk-node.js');

        async function test() {
            try {
                const vdo = new VDONinjaSDK();

                // Test aliases exist
                const aliases = ['send', 'sendMessage', 'emit', 'broadcast'];
                for (const alias of aliases) {
                    if (typeof vdo[alias] !== 'function') {
                        throw new Error(`Alias ${alias} not found`);
                    }
                }

                console.log('✅ All aliases exist');
                process.exit(0);
            } catch (error) {
                console.error('❌ Alias test failed:', error);
                process.exit(1);
            }
        }
        test();
        EOF
        timeout 30s node test-aliases.js

    - name: Start local MediaMTX fixture
      if: matrix.webrtc-lib == '@roamhq/wrtc' && matrix.node-version == 20
      run: |
        docker run -d --name sdk-mediamtx --network host \
          -e MTX_WEBRTCADDITIONALHOSTS=127.0.0.1 \
          bluenviron/mediamtx:1.21.0
        for attempt in $(seq 1 30); do
          if curl -fsS -X OPTIONS http://127.0.0.1:8889/sdk-ready/whip; then exit 0; fi
          sleep 1
        done
        docker logs sdk-mediamtx
        exit 1

    - name: Run WHIP/WHEP integration against local MediaMTX
      if: matrix.webrtc-lib == '@roamhq/wrtc' && matrix.node-version == 20
      env:
        WHIP_URL_TEMPLATE: http://127.0.0.1:8889/{streamId}/whip
        WHEP_URL_TEMPLATE: http://127.0.0.1:8889/{streamId}/whep
      run: |
        timeout 120s node demos/whip-whep-integration-test.js

    - name: MediaMTX diagnostics
      if: failure() && matrix.webrtc-lib == '@roamhq/wrtc' && matrix.node-version == 20
      run: docker logs sdk-mediamtx

  test-summary:
    needs: test-sdk
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.test-sdk.result }}" == "success" ]; then
          echo "✅ All SDK tests passed!"
          exit 0
        else
          echo "❌ Some SDK tests failed"
          exit 1
        fi
