name: Native SDKs

on:
  push:
    branches: [ main, master ]
    paths: [ 'go/**', 'rust/**', 'c/**', 'python/**', 'dart/**', 'kotlin/**', 'swift/**', 'spec/**', '.github/workflows/native-sdks.yml' ]
  pull_request:
    paths: [ 'go/**', 'rust/**', 'c/**', 'python/**', 'dart/**', 'kotlin/**', 'swift/**', 'spec/**', '.github/workflows/native-sdks.yml' ]
  workflow_dispatch:

jobs:
  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum
      - run: go vet ./...
        working-directory: go
      - run: go test -race -count=1 ./...
        working-directory: go

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
        working-directory: rust
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test --workspace
        working-directory: rust

  c:
    name: C SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libcurl4-openssl-dev
      - run: cmake -S c -B c/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build c/build
      - run: ctest --test-dir c/build --output-on-failure

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e './python[test]'
      - run: pytest -q python/tests

  dart:
    name: Dart / Flutter SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub get && dart analyze --fatal-infos && dart test
        working-directory: dart/vdoninja_core
      - run: flutter pub get && flutter analyze --fatal-infos
        working-directory: dart/vdoninja
      - run: flutter pub get && flutter analyze --fatal-infos
        working-directory: dart/vdoninja/example

  kotlin:
    name: Kotlin / Android SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :vdoninja-core:test :vdoninja-android:assembleRelease
        working-directory: kotlin

  swift:
    name: Swift SDK
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: '6.1'
      - run: swift build
        working-directory: swift
      - run: swift test
        working-directory: swift

  interop:
    name: Cross-language interop (Go, C, Python, JavaScript)
    runs-on: ubuntu-latest
    needs: [go, c, python]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
      - run: pip install -e ./python
      - run: npm install && npm install node-datachannel
      - run: python3 spec/interop/run_interop.py --langs go,c,python,js
